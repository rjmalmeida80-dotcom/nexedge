<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0F172A"/>
<title>NexEdge — Motorista</title>
<link rel="manifest" href="/manifest-motorista.json"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0F172A;--s1:#1E293B;--s2:#334155;--t1:#F8FAFC;--t2:#94A3B8;--t3:#475569;--gr:#10B981;--re:#EF4444;--am:#F59E0B;--bl:#3B82F6;--pu:#8B5CF6}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:Inter,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}

/* SCREENS */
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden}
.screen.act{display:flex}

/* LOGIN */
.login-bg{flex:1;background:linear-gradient(180deg,#0F172A 0%,#1E293B 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.login-logo{width:72px;height:72px;background:linear-gradient(135deg,#10b981,#059669);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;box-shadow:0 8px 32px rgba(16,185,129,.3)}
.login-title{font-size:24px;font-weight:800;margin-bottom:6px;text-align:center}
.login-sub{font-size:14px;color:var(--t2);text-align:center;margin-bottom:40px}
.pin-display{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--s2);border:2px solid var(--s2);transition:all .2s}
.pin-dot.fill{background:#10b981;border-color:#10b981}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.num-btn{background:var(--s1);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;font-size:24px;font-weight:700;color:var(--t1);cursor:pointer;transition:all .15s;text-align:center}
.num-btn:active{transform:scale(.94);background:var(--s2)}
.num-btn.del{font-size:18px;color:var(--t2)}
.num-btn.empty{background:transparent;border:none}

/* TOPBAR */
.topbar{background:var(--s1);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);safe-area-inset-top:env(safe-area-inset-top)}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:11px;color:var(--t2);margin-top:1px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* CONTENT */
.scroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* BOTTOMNAV */
.bottomnav{background:var(--s1);border-top:1px solid rgba(255,255,255,.05);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;color:var(--t3);transition:color .15s;border:none;background:none;font-family:inherit}
.nav-item.act{color:#10b981}
.nav-item span:first-child{font-size:22px}
.nav-item span:last-child{font-size:10px;font-weight:600}

/* CARDS */
.card{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:12px;overflow:hidden}
.card-h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
.card-title{font-size:13px;font-weight:600}

/* ENTREGA CARD */
.entrega{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:16px;margin-bottom:10px;overflow:hidden}
.entrega-header{padding:14px 16px;display:flex;align-items:center;gap:12px}
.entrega-num{font-size:11px;font-family:monospace;font-weight:700;color:#10b981;background:rgba(16,185,129,.1);padding:4px 10px;border-radius:6px}
.entrega-dest{font-size:14px;font-weight:600;flex:1}
.entrega-body{padding:0 16px 14px}
.entrega-addr{font-size:13px;color:var(--t2);margin-bottom:10px}
.entrega-actions{display:flex;gap:8px}
.btn{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;flex:1;text-align:center}
.btn-gr{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-am{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.btn-re{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.btn-bl{background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.2)}
.btn:active{transform:scale(.97)}
.badge{display:inline-flex;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600}
.priority-urgente{background:rgba(239,68,68,.15);color:#ef4444}
.priority-alta{background:rgba(245,158,11,.15);color:#f59e0b}
.priority-normal{background:rgba(16,185,129,.1);color:#10b981}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;text-align:center}
.stat-val{font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:4px}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)}

/* POD MODAL */
.pod-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:100;display:flex;flex-direction:column;padding:20px}
.pod-card{background:var(--s1);border-radius:20px;flex:1;display:flex;flex-direction:column;overflow:hidden;max-height:90vh}
.pod-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.pod-body{flex:1;overflow-y:auto;padding:20px}
.pod-input{background:var(--bg);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--t1);width:100%;font-family:inherit;margin-bottom:14px}
.pod-input:focus{border-color:#10b981;outline:none}
.sig-canvas{width:100%;height:160px;background:rgba(255,255,255,.03);border:2px dashed rgba(255,255,255,.1);border-radius:12px;cursor:crosshair;margin-bottom:14px;touch-action:none}
.pod-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:8px}

/* MAPA PLACEHOLDER */
.mapa-container{background:var(--s1);border-radius:16px;overflow:hidden;margin-bottom:12px;height:260px;position:relative}
.mapa-inner{width:100%;height:100%;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364)}

.empty{text-align:center;padding:40px 20px;color:var(--t2);font-size:13px}
.empty-icon{font-size:48px;margin-bottom:12px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen act" id="screen-login">
  <div class="login-bg">
    <div class="login-logo">🚚</div>
    <div class="login-title">NexEdge Motorista</div>
    <div class="login-sub">Insere o teu PIN de 4 dígitos</div>
    <div class="pin-display">
      <div class="pin-dot" id="dot0"></div>
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
    </div>
    <div class="numpad">
      ${[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(n=>`
        <button class="num-btn ${n===''?'empty':n==='⌫'?'del':''}" ${n===''?'disabled':''} onclick="numPress('${n}')">${n}</button>`).join('')}
    </div>
    <div id="login-erro" style="color:#ef4444;font-size:13px;margin-top:16px;text-align:center"></div>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div class="screen" id="screen-app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="topbar-title" id="motorista-nome">Motorista</div>
      <div class="topbar-sub" id="motorista-sub">A carregar...</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="gps-status" style="font-size:10px;color:var(--t3)">📍 GPS off</div>
      <div class="avatar" id="motorista-avatar">M</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="scroll" id="app-content">
    <div class="empty"><div class="empty-icon">⟳</div>A carregar...</div>
  </div>

  <!-- BOTTOMNAV -->
  <div class="bottomnav">
    <button class="nav-item act" id="nav-entregas" onclick="navTab('entregas')"><span>📦</span><span>Entregas</span></button>
    <button class="nav-item" id="nav-mapa" onclick="navTab('mapa')"><span>🗺</span><span>Mapa</span></button>
    <button class="nav-item" id="nav-stats" onclick="navTab('stats')"><span>📊</span><span>Stats</span></button>
    <button class="nav-item" id="nav-perfil" onclick="navTab('perfil')"><span>👤</span><span>Perfil</span></button>
  </div>
</div>

<!-- POD MODAL -->
<div class="pod-overlay" id="pod-overlay" style="display:none">
  <div class="pod-card">
    <div class="pod-header">
      <div style="font-size:15px;font-weight:700">📝 Prova de Entrega</div>
      <button onclick="fecharPOD()" style="background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer">×</button>
    </div>
    <div class="pod-body">
      <div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;margin-bottom:8px">Recebido por *</div>
      <input class="pod-input" id="pod-nome" placeholder="Nome de quem recebeu"/>
      <div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;margin-bottom:8px">Assinatura</div>
      <canvas class="sig-canvas" id="sig-canvas"></canvas>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn btn-am" onclick="limparAssinatura()" style="flex:none;padding:8px 14px">Limpar</button>
        <div style="font-size:12px;color:var(--t3);align-self:center">Assina no campo acima com o dedo</div>
      </div>
      <div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;margin-bottom:8px">Observações</div>
      <input class="pod-input" id="pod-obs" placeholder="Opcional..."/>
      <div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;margin-bottom:8px">Foto da entrega</div>
      <button class="btn btn-bl" onclick="tirarFoto()" style="margin-bottom:14px">📷 Tirar Foto</button>
      <div id="foto-preview" style="display:none;margin-bottom:14px">
        <img id="foto-img" style="width:100%;border-radius:10px;"/>
      </div>
    </div>
    <div class="pod-footer">
      <button class="btn btn-am" onclick="fecharPOD()">Cancelar</button>
      <button class="btn btn-gr" onclick="confirmarPOD()" style="flex:2">✅ Confirmar Entrega</button>
    </div>
  </div>
</div>

<input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="processarFoto(this)"/>

<script>
const API = '/api/motorista-portal';
let token = localStorage.getItem('motorista_token');
let pinAtual = '';
let navAtual = 'entregas';
let empresaId = localStorage.getItem('empresa_id') || 'f10a2feb-024d-4184-b221-f6b37fb754e2';
let entregaActual = null;
let gpsWatcher = null;
let posActual = null;
let sigDrawing = false;
let sigCtx = null;

// ── NUMPAD ──
function numPress(n) {
  if (n === '⌫') { pinAtual = pinAtual.slice(0,-1); }
  else if (n !== '' && pinAtual.length < 4) { pinAtual += n; }
  actualizarDots();
  if (pinAtual.length === 4) setTimeout(tentarLogin, 200);
}

function actualizarDots() {
  for (let i=0;i<4;i++) {
    document.getElementById('dot'+i)?.classList.toggle('fill', i < pinAtual.length);
  }
}

async function tentarLogin() {
  try {
    const r = await fetch(API+'/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:pinAtual, empresa_id:empresaId})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error||'PIN inválido');
    token = d.token;
    localStorage.setItem('motorista_token',token);
    document.getElementById('motorista-nome').textContent = d.motorista.nome;
    document.getElementById('motorista-sub').textContent = d.motorista.empresa;
    document.getElementById('motorista-avatar').textContent = d.motorista.nome[0];
    document.getElementById('screen-login').classList.remove('act');
    document.getElementById('screen-app').classList.add('act');
    iniciarGPS();
    navTab('entregas');
  } catch(e) {
    document.getElementById('login-erro').textContent = e.message;
    pinAtual = '';
    actualizarDots();
    setTimeout(()=>document.getElementById('login-erro').textContent='', 2000);
  }
}

async function apiFetch(path, opts={}) {
  const r = await fetch(API+path, {
    ...opts,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── GPS ──
function iniciarGPS() {
  if (!navigator.geolocation) return;
  document.getElementById('gps-status').textContent = '📍 GPS on';
  document.getElementById('gps-status').style.color = '#10b981';
  gpsWatcher = navigator.geolocation.watchPosition(pos => {
    posActual = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
    apiFetch('/localizacao', {method:'POST', body:JSON.stringify({latitude:pos.coords.latitude, longitude:pos.coords.longitude})}).catch(()=>{});
  }, null, {enableHighAccuracy:true, maximumAge:30000});
}

// ── NAVEGAÇÃO ──
function navTab(tab) {
  navAtual = tab;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('act'));
  document.getElementById('nav-'+tab)?.classList.add('act');
  carregar();
}

async function carregar() {
  const c = document.getElementById('app-content');
  c.innerHTML = '<div class="empty"><div class="empty-icon">⟳</div>A carregar...</div>';
  try {
    if (navAtual === 'entregas') await rEntregas();
    else if (navAtual === 'mapa') await rMapa();
    else if (navAtual === 'stats') await rStats();
    else if (navAtual === 'perfil') await rPerfil();
  } catch(e) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${e.message}</div>`;
  }
}

// ── ENTREGAS ──
async function rEntregas() {
  const entregas = await apiFetch('/entregas');
  const c = document.getElementById('app-content');

  if (!entregas.length) {
    c.innerHTML = '<div class="empty"><div class="empty-icon">🎉</div><div>Sem entregas pendentes hoje!</div></div>';
    return;
  }

  const EST_COR = {em_transito:'#3b82f6',em_entrega:'#f59e0b',confirmada:'#8b5cf6',pronta_recolha:'#06b6d4',recolhida:'#10b981'};
  const EST_LABEL = {em_transito:'Em Trânsito',em_entrega:'Em Entrega',confirmada:'Confirmada',pronta_recolha:'Pronta Recolha',recolhida:'Recolhida'};
  const PROX_ACAO = {confirmada:'recolhida',recolhida:'em_transito',em_transito:'em_entrega',em_entrega:'entregue'};
  const ACAO_LABEL = {recolhida:'✅ Recolhida',em_transito:'🚚 Em Trânsito',em_entrega:'🏃 Em Entrega',entregue:'📦 Entregar (POD)'};

  c.innerHTML = `
    <div style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px">${entregas.length} entrega${entregas.length!==1?'s':''} hoje</div>
    ${entregas.map(e=>`
      <div class="entrega">
        <div class="entrega-header">
          <span class="entrega-num">${e.numero}</span>
          <div class="entrega-dest">${e.destinatario_nome}</div>
          <span class="badge priority-${e.prioridade||'normal'}">${e.prioridade||'normal'}</span>
        </div>
        <div class="entrega-body">
          <div class="entrega-addr">📍 ${e.destinatario_morada||''}, ${e.destinatario_localidade||''}</div>
          <div style="font-size:12px;color:var(--t3);margin-bottom:10px">${e.peso_kg||0}kg · ${e.num_volumes||1} vol. · ${e.destinatario_pais||'PT'}</div>
          ${e.data_entrega_prevista?`<div style="font-size:11px;color:var(--am);margin-bottom:10px">⏰ Prazo: ${new Date(e.data_entrega_prevista).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`:''}
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
            <span style="width:8px;height:8px;border-radius:50%;background:${EST_COR[e.estado]||'#6b7280'}"></span>
            <span style="font-size:12px;font-weight:500;color:${EST_COR[e.estado]||'var(--t2)'}">${EST_LABEL[e.estado]||e.estado}</span>
          </div>
          <div class="entrega-actions">
            ${PROX_ACAO[e.estado] ? `
              <button class="btn ${PROX_ACAO[e.estado]==='entregue'?'btn-gr':'btn-bl'}" onclick="${PROX_ACAO[e.estado]==='entregue'?`abrirPOD('${e.id}')`:`mudarEstado('${e.id}','${PROX_ACAO[e.estado]}')`}">
                ${ACAO_LABEL[PROX_ACAO[e.estado]]||PROX_ACAO[e.estado]}
              </button>` : ''}
            <button class="btn btn-am" onclick="reportarProblema('${e.id}')" style="flex:none;padding:10px 12px">⚠️</button>
            <a href="https://maps.google.com/?q=${encodeURIComponent((e.destinatario_morada||'')+' '+(e.destinatario_localidade||''))}" target="_blank" style="text-decoration:none">
              <button class="btn btn-bl" style="flex:none;padding:10px 12px">🗺</button>
            </a>
          </div>
        </div>
      </div>`).join('')}`;
}

async function mudarEstado(id, estado) {
  try {
    await apiFetch('/entregas/'+id+'/estado', {method:'PUT', body:JSON.stringify({estado, latitude:posActual?.latitude, longitude:posActual?.longitude})});
    carregar();
  } catch(e) { alert('Erro: '+e.message); }
}

async function reportarProblema(id) {
  const notas = prompt('Descreve o problema:');
  if (!notas) return;
  try {
    await apiFetch('/entregas/'+id+'/estado', {method:'PUT', body:JSON.stringify({estado:'problema', notas})});
    carregar();
  } catch(e) { alert('Erro: '+e.message); }
}

// ── POD ──
function abrirPOD(id) {
  entregaActual = id;
  document.getElementById('pod-overlay').style.display = 'flex';
  document.getElementById('pod-nome').value = '';
  document.getElementById('pod-obs').value = '';
  document.getElementById('foto-preview').style.display = 'none';
  iniciarCanvas();
}

function fecharPOD() {
  document.getElementById('pod-overlay').style.display = 'none';
  entregaActual = null;
}

function iniciarCanvas() {
  const canvas = document.getElementById('sig-canvas');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  sigCtx.strokeStyle = '#10b981';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  };

  canvas.addEventListener('pointerdown', e => { sigDrawing=true; const p=getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); });
  canvas.addEventListener('pointermove', e => { if(!sigDrawing)return; const p=getPos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); });
  canvas.addEventListener('pointerup', () => sigDrawing=false);
}

function limparAssinatura() {
  const canvas = document.getElementById('sig-canvas');
  sigCtx?.clearRect(0, 0, canvas.width, canvas.height);
}

function tirarFoto() { document.getElementById('camera-input').click(); }

function processarFoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('foto-img').src = e.target.result;
    document.getElementById('foto-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

async function confirmarPOD() {
  const nome = document.getElementById('pod-nome')?.value?.trim();
  if (!nome) { alert('Nome de quem recebeu é obrigatório'); return; }

  const canvas = document.getElementById('sig-canvas');
  const assinatura = canvas.toDataURL('image/png');
  const fotoSrc = document.getElementById('foto-img')?.src;

  try {
    await apiFetch('/entregas/'+entregaActual+'/pod', {method:'POST', body:JSON.stringify({
      recebido_por: nome,
      assinatura_base64: assinatura !== 'data:,' ? assinatura : null,
      foto_base64: fotoSrc && fotoSrc.startsWith('data:image') ? fotoSrc : null,
      latitude: posActual?.latitude,
      longitude: posActual?.longitude,
      observacoes: document.getElementById('pod-obs')?.value||'',
    })});
    fecharPOD();
    alert('✅ Entrega confirmada com sucesso!');
    carregar();
  } catch(e) { alert('Erro: '+e.message); }
}

// ── MAPA ──
async function rMapa() {
  const c = document.getElementById('app-content');
  c.innerHTML = `
    <div class="mapa-container">
      <div class="mapa-inner" id="leaflet-map" style="width:100%;height:100%"></div>
    </div>
    <div id="mapa-entregas"></div>`;

  // Carregar Leaflet dinamicamente
  if (!window.L) {
    await carregarScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
  }

  const map = L.map('leaflet-map', {zoomControl:false}).setView([38.7,-9.1], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:19}).addTo(map);

  try {
    const entregas = await apiFetch('/entregas');
    for (const e of entregas) {
      if (e.destinatario_morada) {
        const cor = e.estado==='em_entrega'?'#10b981':e.estado==='em_transito'?'#3b82f6':'#f59e0b';
        const icon = L.divIcon({html:`<div style="background:${cor};width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px ${cor}"></div>`,iconSize:[12,12],className:''});
        L.marker([38.7 + Math.random()*0.2-0.1, -9.1 + Math.random()*0.2-0.1], {icon})
          .addTo(map).bindPopup(`<b>${e.numero}</b><br>${e.destinatario_nome}`);
      }
    }
    if (posActual) {
      const meIcon = L.divIcon({html:`<div style="background:#8b5cf6;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #8b5cf6"></div>`,iconSize:[16,16],className:''});
      L.marker([posActual.latitude, posActual.longitude], {icon:meIcon}).addTo(map).bindPopup('📍 A tua posição');
      map.setView([posActual.latitude, posActual.longitude], 12);
    }
  } catch(e) {}
}

function carregarScript(src) {
  return new Promise(res=>{ const s=document.createElement('script');s.src=src;s.onload=res;document.head.appendChild(s); });
}

      <div style="font-size:20px;font-weight:700">${perfil.nome}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:4px">${perfil.pais||'PT'} · ${perfil.licenca||'—'}</div>
    </div>
    <div class="card">
      <div class="card-h"><div class="card-title">🚐 Veículo</div></div>
      <div style="padding:16px">
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">
          <span style="color:var(--t2)">Matrícula</span><span style="font-weight:600">${perfil.matricula||'—'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">
          <span style="color:var(--t2)">Modelo</span><span style="font-weight:600">${perfil.modelo||'—'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0">
          <span style="color:var(--t2)">Capacidade</span><span style="font-weight:600">${perfil.capacidade_kg||0}kg</span>
        </div>
      </div>
    </div>
    <button onclick="logout()" style="width:100%;padding:14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:12px;color:#ef4444;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px">Terminar Sessão</button>`;
}

function logout() {
  localStorage.removeItem('motorista_token');
  token = null; pinAtual = '';
  actualizarDots();
  document.getElementById('screen-app').classList.remove('act');
  document.getElementById('screen-login').classList.add('act');
}

// Auto-login se tiver token
if (token) {
  fetch(API+'/perfil',{headers:{'Authorization':'Bearer '+token}})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(p=>{
      document.getElementById('motorista-nome').textContent=p.nome;
      document.getElementById('motorista-avatar').textContent=p.nome[0];
      document.getElementById('screen-login').classList.remove('act');
      document.getElementById('screen-app').classList.add('act');
      iniciarGPS();
      navTab('entregas');
    }).catch(()=>{ localStorage.removeItem('motorista_token'); token=null; });
}
