<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <title>NexHR Logo</title>
  <desc>Logotipo premium NexHR — plataforma de gestão de recursos humanos</desc>

  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0F4C9E"/>
      <stop offset="100%" stop-color="#185FA5"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0F9E75"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
    <linearGradient id="gMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A3F8C"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro premium -->
  <rect width="800" height="400" fill="#0A0F1E"/>

  <!-- Efeito de profundidade -->
  <circle cx="100"  cy="80"  r="220" fill="#0F1E3A" opacity="0.6"/>
  <circle cx="700" cy="320" r="180" fill="#0A2040" opacity="0.5"/>
  <circle cx="400" cy="200" r="280" fill="#061428" opacity="0.4"/>

  <!-- Grelha de fundo -->
  <line x1="100" y1="0"   x2="100" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="200" y1="0"   x2="200" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="300" y1="0"   x2="300" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="0"   x2="400" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="500" y1="0"   x2="500" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="600" y1="0"   x2="600" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="700" y1="0"   x2="700" y2="400" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="100"   x2="800" y2="100" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="200"   x2="800" y2="200" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="300"   x2="800" y2="300" stroke="#1a2a44" stroke-width="0.5" opacity="0.4"/>

  <!-- Símbolo hexagonal — rede de pessoas -->
  <g transform="translate(155, 116)">
    <!-- Hexágono exterior -->
    <path d="M0 0 L46 -27 L92 0 L92 54 L46 81 L0 54 Z"
          fill="none" stroke="#1E3A6E" stroke-width="1"/>
    <!-- Hexágono interior -->
    <path d="M10 6 L46 -15 L82 6 L82 48 L46 69 L10 48 Z"
          fill="none" stroke="#1E4A8E" stroke-width="0.5" opacity="0.6"/>

    <!-- Linhas de ligação -->
    <path d="M15 45 L15 9 L46 -9 L46 27" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15 9  L46 27 L77 9"         fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M46 27 L46 63"               fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nós -->
    <circle cx="15" cy="45" r="4" fill="#185FA5"/>
    <circle cx="15" cy="9"  r="4" fill="#185FA5"/>
    <circle cx="46" cy="-9" r="4" fill="#185FA5"/>
    <circle cx="46" cy="27" r="5" fill="#0F7A5A"/>
    <circle cx="77" cy="9"  r="4" fill="#185FA5"/>
    <circle cx="46" cy="63" r="4" fill="#1D9E75"/>

    <!-- Pulso no nó central -->
    <circle cx="46" cy="27" r="10" fill="none" stroke="#185FA5" stroke-width="0.5" opacity="0.4"/>
    <circle cx="46" cy="27" r="16" fill="none" stroke="#185FA5" stroke-width="0.3" opacity="0.2"/>
  </g>

  <!-- Wordmark: Nex -->
  <text x="282" y="186"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="-3"
        fill="#FFFFFF">Nex</text>

  <!-- Wordmark: HR em verde -->
  <text x="428" y="186"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="-3"
        fill="#1D9E75">HR</text>

  <!-- Linha decorativa -->
  <rect x="282" y="198" width="220" height="1.5" fill="#185FA5" opacity="0.7"/>
  <rect x="282" y="198" width="110" height="1.5" fill="#1D9E75" opacity="0.9"/>

  <!-- Tagline -->
  <text x="282" y="222"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11"
        font-weight="300"
        letter-spacing="5"
        fill="#5B8FC9">HUMAN RESOURCES PLATFORM</text>

  <!-- Pontos decorativos -->
  <circle cx="680" cy="60"  r="2"   fill="#185FA5" opacity="0.6"/>
  <circle cx="706" cy="46"  r="1.5" fill="#1D9E75" opacity="0.5"/>
  <circle cx="693" cy="74"  r="1"   fill="#185FA5" opacity="0.4"/>
  <circle cx="92"  cy="340" r="2"   fill="#1D9E75" opacity="0.5"/>
  <circle cx="108" cy="356" r="1.5" fill="#185FA5" opacity="0.4"/>

  <!-- Linha inferior -->
  <rect x="90"  y="373" width="620" height="0.5" fill="#1E3A6E" opacity="0.5"/>

  <!-- Rodapé -->
  <text x="400" y="390"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="9"
        font-weight="300"
        letter-spacing="3"
        text-anchor="middle"
        fill="#2E5080">PORTUGAL  ·  GESTÃO DE RECURSOS HUMANOS  ·  2025</text>
</svg>
