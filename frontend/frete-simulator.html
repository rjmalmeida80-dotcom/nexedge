<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NexEdge — Simulador de Frete</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0F172A;color:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:700px}
.logo{text-align:center;margin-bottom:32px}
.logo-title{font-size:28px;font-weight:900;letter-spacing:-1px}
.logo-title span{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:13px;color:#64748b;margin-top:4px}
.card{background:#1E293B;border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fg{margin-bottom:0}
.fl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#64748b;display:block;margin-bottom:6px}
.fi{padding:11px 14px;border:1.5px solid rgba(255,255,255,.08);border-radius:10px;font-size:14px;color:#f8fafc;background:#0F172A;width:100%;font-family:inherit;outline:none;transition:border-color .15s}
.fi:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.1)}
select.fi{cursor:pointer}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:4px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(16,185,129,.3)}
.resultado{background:#0F172A;border:1px solid rgba(16,185,129,.2);border-radius:16px;padding:24px;display:none}
.resultado.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.preco-principal{text-align:center;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:20px}
.preco-val{font-size:52px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.preco-moeda{font-size:20px;font-weight:600;color:#64748b;margin-bottom:4px}
.preco-prazo{font-size:14px;color:#64748b;margin-top:4px}
.opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.opcao{background:#1E293B;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .15s}
.opcao:hover,.opcao.sel{border-color:#10b981;background:rgba(16,185,129,.08)}
.opcao-nome{font-size:12px;font-weight:600;text-transform:uppercase;color:#64748b;margin-bottom:6px}
.opcao-preco{font-size:20px;font-weight:800;color:#10b981}
.opcao-dias{font-size:11px;color:#64748b;margin-top:3px}
.detalhe-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.detalhe-row:last-child{border-bottom:none}
.detalhe-val{font-weight:600}
.badge-pais{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:600;color:#10b981}
.embed-code{background:#0F172A;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 16px;font-family:monospace;font-size:11px;color:#64748b;word-break:break-all;margin-top:12px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-title">Nexedge <span>Frete</span></div>
    <div class="logo-sub">Calculador de preços de envio — PT · CH · FR · DE · ES</div>
  </div>

  <div class="card">
    <div class="card-title">📦 Dados do Envio</div>
    <div class="grid-2" style="margin-bottom:14px">
      <div class="fg">
        <label class="fl">País de Origem</label>
        <select class="fi" id="origem">
          <option value="PT">🇵🇹 Portugal</option>
          <option value="CH">🇨🇭 Suíça</option>
          <option value="FR">🇫🇷 França</option>
          <option value="DE">🇩🇪 Alemanha</option>
          <option value="ES">🇪🇸 Espanha</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">País de Destino</label>
        <select class="fi" id="destino">
          <option value="PT">🇵🇹 Portugal</option>
          <option value="CH" selected>🇨🇭 Suíça</option>
          <option value="FR">🇫🇷 França</option>
          <option value="DE">🇩🇪 Alemanha</option>
          <option value="ES">🇪🇸 Espanha</option>
        </select>
      </div>
    </div>
    <div class="grid-3" style="margin-bottom:14px">
      <div class="fg">
        <label class="fl">Peso (kg)</label>
        <input class="fi" id="peso" type="number" value="5" min="0.1" step="0.1"/>
      </div>
      <div class="fg">
        <label class="fl">Comprimento (cm)</label>
        <input class="fi" id="comp" type="number" value="40" min="1"/>
      </div>
      <div class="fg">
        <label class="fl">Largura × Altura (cm)</label>
        <input class="fi" id="larg" type="number" value="30" min="1"/>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <input type="checkbox" id="urgente" style="width:16px;height:16px;accent-color:#10b981"/>
      <label for="urgente" style="font-size:13px;cursor:pointer">🚨 Envio urgente / expresso</label>
    </div>
    <button class="btn" onclick="calcular()">🧮 Calcular Preço</button>
  </div>

  <div class="resultado" id="resultado">
    <div class="preco-principal">
      <div class="preco-moeda" id="res-moeda">EUR</div>
      <div class="preco-val" id="res-preco">—</div>
      <div class="preco-prazo" id="res-prazo">—</div>
    </div>
    <div class="opcoes" id="res-opcoes"></div>
    <div id="res-detalhes"></div>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;color:#64748b;margin-bottom:8px">Integrar no teu site</div>
      <div class="embed-code" id="embed-code"></div>
    </div>
  </div>
</div>

<script>
async function calcular() {
  const origem=document.getElementById('origem').value;
  const destino=document.getElementById('destino').value;
  const peso=parseFloat(document.getElementById('peso').value)||1;
  const comp=parseFloat(document.getElementById('comp').value)||40;
  const larg=parseFloat(document.getElementById('larg').value)||30;
  const urgente=document.getElementById('urgente').checked;
  const alt=larg;
  const volume_m3=(comp*larg*alt)/1000000;

  try {
    const token=localStorage.getItem('access_token')||(()=>{try{const r=localStorage.getItem('rh-auth');return r?JSON.parse(r)?.state?.token:null}catch(e){return null}})();
    const headers={'Content-Type':'application/json'};
    if(token)headers['Authorization']='Bearer '+token;

    const r=await fetch('/api/auto/simular-frete',{method:'POST',headers,body:JSON.stringify({origem_pais:origem,destino_pais:destino,peso_kg:peso,volume_m3,urgente})});
    const d=await r.json();

    document.getElementById('res-preco').textContent=d.preco.total.toFixed(2);
    document.getElementById('res-moeda').textContent=d.preco.moeda;
    document.getElementById('res-prazo').textContent=`⏱ Prazo estimado: ${d.prazo_dias} dia${d.prazo_dias!==1?'s':''}`;

    const PAIS={PT:'🇵🇹 Portugal',CH:'🇨🇭 Suíça',FR:'🇫🇷 França',DE:'🇩🇪 Alemanha',ES:'🇪🇸 Espanha'};
    document.getElementById('res-opcoes').innerHTML=d.opcoes.map((o,i)=>`
      <div class="opcao ${i===0?'sel':''}" onclick="document.querySelectorAll('.opcao').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')">
        <div class="opcao-nome">${o.servico}</div>
        <div class="opcao-preco">${o.preco.toFixed(2)}</div>
        <div class="opcao-dias">${o.dias} dia${o.dias!==1?'s':''}</div>
      </div>`).join('');

    document.getElementById('res-detalhes').innerHTML=`
      <div class="detalhe-row"><span style="color:#64748b">Rota</span><span class="detalhe-val">${PAIS[d.origem_pais]} → ${PAIS[d.destino_pais]}</span></div>
      <div class="detalhe-row"><span style="color:#64748b">Peso real</span><span class="detalhe-val">${d.peso_real_kg}kg</span></div>
      <div class="detalhe-row"><span style="color:#64748b">Volume</span><span class="detalhe-val">${(d.volume_m3*1000000).toFixed(0)}cm³</span></div>
      <div class="detalhe-row"><span style="color:#64748b">Peso taxável</span><span class="detalhe-val">${d.peso_taxavel_kg}kg</span></div>
      ${urgente?`<div class="detalhe-row"><span style="color:#64748b">Supl. urgente</span><span class="detalhe-val">+${d.preco.suplemento_urgente.toFixed(2)}${d.preco.moeda}</span></div>`:''}`;

    document.getElementById('embed-code').textContent=`<script src="https://app.nexedge.pt/frete-widget.js"><\/script>`;
    document.getElementById('resultado').classList.add('show');
  } catch(e) {
    // Calcular localmente se API não disponível
    const tarifas={PT:{PT:5,CH:45,FR:25,DE:35,ES:20},CH:{CH:15,PT:45,FR:30,DE:25,ES:40},FR:{FR:8,PT:25,CH:30,DE:20,ES:15},DE:{DE:8,PT:35,CH:25,FR:20,ES:28},ES:{ES:6,PT:20,CH:40,FR:15,DE:28}};
    const base=(tarifas[origem]?.[destino]||20)+(peso*0.5);
    const total=urgente?base*1.4:base;
    document.getElementById('res-preco').textContent=total.toFixed(2);
    document.getElementById('res-moeda').textContent=origem==='CH'||destino==='CH'?'CHF':'EUR';
    document.getElementById('res-prazo').textContent=`⏱ Estimativa sem API`;
    document.getElementById('res-opcoes').innerHTML='';
    document.getElementById('res-detalhes').innerHTML=`<div style="font-size:12px;color:#64748b">Cálculo local (API não disponível)</div>`;
    document.getElementById('resultado').classList.add('show');
  }
}
calcular();
</script>
</body>
</html>
