<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITSM — NexEdge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,sans-serif;background:#0D0D1A;color:rgba(255,255,255,.9);min-height:100vh}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:220px;background:#0F0F1E;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;bottom:0;left:0}
    .logo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
    .logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
    .logo-text{color:#fff;font-weight:700;font-size:13px}
    .back-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.06);transition:color .15s}
    .back-btn:hover{color:#fff}
    .main{margin-left:220px;flex:1;display:flex;flex-direction:column}
    .topbar{height:52px;background:#13131F;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:10}
    .topbar h1{font-size:16px;font-weight:700;color:#fff}
    .btn-primary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 1px 8px rgba(79,70,229,.4);font-family:inherit}
    .btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
    .content{padding:24px;flex:1}
    .tabs{display:flex;gap:2px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:20px}
    .tab{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.3);transition:all .15s;font-family:inherit}
    .tab.active{border-bottom-color:#4F46E5;color:#818CF8}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
    .kpi{background:#13131F;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:20px}
    .kpi-valor{font-size:28px;font-weight:800;margin-bottom:4px}
    .kpi-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.05em}
    .kpi-sub{font-size:11px;color:rgba(255,255,255,.25);margin-top:4px}
    .card{background:#13131F;border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:16px}
    .card-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between}
    .card-title{font-size:13px;font-weight:600;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead tr{background:#1A1A2E;border-bottom:2px solid rgba(255,255,255,.07)}
    th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.3);white-space:nowrap}
    td{padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.05);color:rgba(255,255,255,.7);vertical-align:middle}
    tr:hover td{background:rgba(79,70,229,.08)}
    tr:last-child td{border-bottom:none}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap}
    .form-input{width:100%;padding:8px 12px;font-size:14px;background:#1A1A2E;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.9);outline:none;font-family:inherit}
    .form-input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
    .form-select{width:100%;padding:8px 12px;font-size:13px;background:#1A1A2E;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.9);outline:none;font-family:inherit;cursor:pointer}
    .form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.3);margin-bottom:5px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
    .modal{background:#13131F;border:1px solid rgba(255,255,255,.1);border-radius:16px;width:100%;max-width:560px;margin-top:20px}
    .modal-header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center}
    .modal-title{font-size:17px;font-weight:700;color:#fff}
    .modal-close{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);font-size:22px;line-height:1}
    .modal-body{padding:24px;display:flex;flex-direction:column;gap:14px}
    .modal-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:8px;justify-content:flex-end}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .filters .form-input,.filters .form-select{width:auto}
    .sla-bar{height:6px;background:#1A1A2E;border-radius:3px;margin-top:4px}
    .sla-fill{height:100%;border-radius:3px;transition:width .3s}
    .empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.25)}
    .empty-icon{font-size:40px;margin-bottom:12px}
    .row-clickable{cursor:pointer}
    textarea.form-input{resize:vertical;min-height:80px}
    .nota-interna{font-size:10px;color:#f59e0b;font-weight:600;margin-left:4px}
    .actividade{background:#1A1A2E;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:12px;margin-bottom:8px}
    .actividade.nota{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2)}
    .actividade.sistema{background:rgba(99,102,241,.06);border-color:rgba(99,102,241,.15)}
    .act-header{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:12px}
    .act-autor{font-weight:600;color:#fff}
    .act-data{color:rgba(255,255,255,.25);margin-left:auto}
    .act-texto{font-size:13px;color:rgba(255,255,255,.6);line-height:1.5}
    .detail-grid{display:grid;grid-template-columns:1fr 260px;gap:0;min-height:0}
    .detail-main{padding:24px;border-right:1px solid rgba(255,255,255,.07)}
    .detail-side{padding:20px;display:flex;flex-direction:column;gap:14px}
    .detail-field{margin-bottom:12px}
    .detail-field-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
    .detail-field-val{font-size:13px;color:rgba(255,255,255,.7)}
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">N</div>
      <div class="logo-text">nexedge</div>
    </div>
    <a href="/" class="back-btn">← Voltar ao ERP</a>
  </div>
  <div class="main">
    <div class="topbar">
      <h1>🎫 ITSM — Service Management</h1>
      <div style="margin-left:auto">
        <button class="btn-primary" onclick="abrirModalNovo()">+ Novo Ticket</button>
      </div>
    </div>
    <div class="content">
      <div class="tabs">
        <button class="tab active" onclick="mudarTab('dashboard',this)">Dashboard</button>
        <button class="tab" onclick="mudarTab('tickets',this)">Tickets</button>
        <button class="tab" onclick="mudarTab('problemas',this)">Problemas</button>
        <button class="tab" onclick="mudarTab('mudancas',this)">Mudanças</button>
        <button class="tab" onclick="mudarTab('conhecimento',this)">Base Conhecimento</button>
        <button class="tab" onclick="mudarTab('relatorios',this)">Relatórios</button>
      </div>
      <div id="conteudo"></div>
    </div>
  </div>
</div>

<!-- Modal Novo Ticket -->
<div id="modal-novo" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Novo Ticket</div>
      <button class="modal-close" onclick="fecharModalNovo()">×</button>
    </div>
    <div class="modal-body">
      <div class="grid-2">
        <div><label class="form-label">Tipo</label>
          <select class="form-select" id="n-tipo">
            <option value="request">Pedido</option>
            <option value="incident">Incidente</option>
            <option value="problem">Problema</option>
            <option value="change">Mudança</option>
            <option value="task">Tarefa</option>
          </select>
        </div>
        <div><label class="form-label">Prioridade</label>
          <select class="form-select" id="n-prioridade">
            <option value="media">🟡 Média</option>
            <option value="alta">🟠 Alta</option>
            <option value="critica">🔴 Crítica</option>
            <option value="baixa">⚪ Baixa</option>
          </select>
        </div>
      </div>
      <div><label class="form-label">Título *</label>
        <input class="form-input" id="n-titulo" placeholder="Descreva o problema ou pedido"/>
      </div>
      <div><label class="form-label">Descrição</label>
        <textarea class="form-input" id="n-descricao" placeholder="Detalhes, passos para reproduzir..."></textarea>
      </div>
      <div class="grid-2">
        <div><label class="form-label">Categoria</label>
          <select class="form-select" id="n-categoria"></select>
        </div>
        <div><label class="form-label">Atribuir a</label>
          <select class="form-select" id="n-atribuido"></select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModalNovo()">Cancelar</button>
      <button class="btn-primary" onclick="criarTicket()">Criar Ticket</button>
    </div>
  </div>
</div>

<!-- Modal Detalhe Ticket -->
<div id="modal-detalhe" class="modal-overlay" style="display:none;align-items:flex-start">
  <div class="modal" style="max-width:800px">
    <div class="modal-header" id="detalhe-header">
      <div class="modal-title" id="detalhe-titulo">—</div>
      <button class="modal-close" onclick="fecharDetalhe()">×</button>
    </div>
    <div class="detail-grid" id="detalhe-corpo"></div>
  </div>
</div>

<script>
const API = '/api';
let TOKEN = localStorage.getItem('rh-auth') ? JSON.parse(localStorage.getItem('rh-auth'))?.state?.token : null;
let tabActual = 'dashboard';
let categorias = [], utilizadores = [], ticketActual = null;

const COR_PRIO = {critica:'#ef4444',alta:'#f97316',media:'#f59e0b',baixa:'#6b7280'};
const COR_EST  = {aberto:'#6366f1',em_progresso:'#3b82f6',pendente:'#f59e0b',resolvido:'#10b981',fechado:'#6b7280',cancelado:'#ef4444'};
const TIPO_L   = {incident:'Incidente',request:'Pedido',problem:'Problema',change:'Mudança',task:'Tarefa'};

function badge(cor, label) {
  return `<span class="badge" style="background:${cor}20;color:${cor}">${label}</span>`;
}

async function api(path, opts={}) {
  if (!TOKEN) {
    const auth = localStorage.getItem('rh-auth');
    if (auth) TOKEN = JSON.parse(auth)?.state?.token;
  }
  const r = await fetch(API + path, {
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...opts.headers },
    ...opts
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function fmtD(d) { return d ? new Date(d).toLocaleDateString('pt-PT') : '—'; }
function fmtDT(d) { return d ? new Date(d).toLocaleString('pt-PT') : '—'; }

async function init() {
  try {
    [categorias, utilizadores] = await Promise.all([
      api('/itsm/categorias'),
      api('/utilizadores').then(r => r.utilizadores || r || []),
    ]);
    // Preencher selects do modal
    const sc = document.getElementById('n-categoria');
    sc.innerHTML = '<option value="">Seleccionar...</option>' + categorias.map(c => `<option value="${c.id}">${c.icone} ${c.nome}</option>`).join('');
    const su = document.getElementById('n-atribuido');
    su.innerHTML = '<option value="">Não atribuído</option>' + utilizadores.map(u => `<option value="${u.id}">${u.nome_completo}</option>`).join('');
  } catch(e) { console.error('Init error:', e); }
  carregarTab();
}

function mudarTab(tab, el) {
  tabActual = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  carregarTab();
}

async function carregarTab() {
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div style="padding:40px;text-align:center;color:rgba(255,255,255,.3)">A carregar...</div>';
  try {
    if (tabActual === 'dashboard') await renderDashboard();
    else if (tabActual === 'tickets') await renderTickets();
    else if (tabActual === 'problemas') await renderProblemas();
    else if (tabActual === 'mudancas') await renderMudancas();
    else if (tabActual === 'conhecimento') await renderConhecimento();
    else if (tabActual === 'relatorios') await renderRelatorios();
  } catch(e) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div>${e.message}</div></div>`;
  }
}

async function renderDashboard() {
  const d = await api('/itsm/dashboard');
  const k = d.kpis;
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="kpi-valor" style="color:#818CF8">${k.abertos}</div><div class="kpi-label">Tickets abertos</div></div>
      <div class="kpi"><div class="kpi-valor" style="color:${k.urgentes>0?'#ef4444':'#6b7280'}">${k.urgentes}</div><div class="kpi-label">Urgentes</div></div>
      <div class="kpi"><div class="kpi-valor" style="color:${k.sla_breach>0?'#f97316':'#10b981'}">${k.sla_breach}</div><div class="kpi-label">SLA Breach</div></div>
      <div class="kpi"><div class="kpi-valor" style="color:#6EE7B7">${k.mttr_min}min</div><div class="kpi-label">MTTR</div><div class="kpi-sub">CSAT: ${k.satisfacao_media}/5</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-header"><span class="card-title">SLA Compliance (30 dias)</span></div>
        <div style="padding:20px">
          ${[{l:'Resposta',p:k.sla_resposta_pct},{l:'Resolução',p:k.sla_resolucao_pct}].map(s=>`
            <div style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span style="color:rgba(255,255,255,.5)">${s.l}</span>
                <span style="font-weight:600;color:${s.p>=95?'#10b981':s.p>=80?'#f59e0b':'#ef4444'}">${s.p}%</span>
              </div>
              <div class="sla-bar"><div class="sla-fill" style="width:${s.p}%;background:${s.p>=95?'#10b981':s.p>=80?'#f59e0b':'#ef4444'}"></div></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Por Estado</span></div>
        <div style="padding:20px">
          ${(d.por_estado||[]).map(e=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <div style="width:10px;height:10px;border-radius:50%;background:${COR_EST[e.estado]||'#6b7280'};flex-shrink:0"></div>
              <span style="font-size:12px;color:rgba(255,255,255,.5);flex:1;text-transform:capitalize">${e.estado.replace('_',' ')}</span>
              <span style="font-size:12px;font-weight:600;color:#fff">${e.total}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Tickets Recentes</span></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Número</th><th>Título</th><th>Prioridade</th><th>Estado</th><th>Atribuído</th><th>Criado</th></tr></thead>
          <tbody>
            ${(d.recentes||[]).map(t=>`
              <tr class="row-clickable" onclick="abrirDetalhe('${t.id}')">
                <td style="font-family:monospace;font-size:12px">${t.numero}</td>
                <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${t.titulo}</td>
                <td>${badge(COR_PRIO[t.prioridade],t.prioridade)}</td>
                <td>${badge(COR_EST[t.estado],t.estado.replace('_',' '))}</td>
                <td style="font-size:12px">${t.atribuido_nome||'—'}</td>
                <td style="font-size:12px">${fmtD(t.criado_em)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function renderTickets() {
  const d = await api('/itsm/tickets?limite=50');
  const tickets = d.tickets || [];
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="filters">
      <input class="form-input" placeholder="Pesquisar..." oninput="filtrarTickets(this.value)" style="width:220px"/>
      <select class="form-select" onchange="filtrarTicketsPor('estado',this.value)" style="width:160px">
        <option value="">Todos os estados</option>
        ${['aberto','em_progresso','pendente','resolvido','fechado','cancelado'].map(s=>`<option value="${s}">${s.replace('_',' ')}</option>`).join('')}
      </select>
      <select class="form-select" onchange="filtrarTicketsPor('tipo',this.value)" style="width:140px">
        <option value="">Todos os tipos</option>
        ${Object.entries(TIPO_L).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
      <select class="form-select" onchange="filtrarTicketsPor('prioridade',this.value)" style="width:150px">
        <option value="">Todas as prioridades</option>
        ${['critica','alta','media','baixa'].map(p=>`<option value="${p}">${p}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <div style="overflow-x:auto">
        <table id="tabela-tickets">
          <thead><tr><th>Número</th><th>Título</th><th>Tipo</th><th>Prioridade</th><th>Estado</th><th>Atribuído</th><th>SLA</th><th>Criado</th></tr></thead>
          <tbody>${renderLinhasTickets(tickets)}</tbody>
        </table>
      </div>
    </div>`;
  window._tickets = tickets;
}

function renderLinhasTickets(tickets) {
  if (!tickets.length) return `<tr><td colspan="8" style="text-align:center;padding:40px;color:rgba(255,255,255,.25)">Sem tickets</td></tr>`;
  return tickets.map(t=>`
    <tr class="row-clickable" onclick="abrirDetalhe('${t.id}')">
      <td style="font-family:monospace;font-size:12px;white-space:nowrap">${t.numero}</td>
      <td style="max-width:220px">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${t.titulo}</div>
        ${t.categoria_nome?`<div style="font-size:11px;color:rgba(255,255,255,.25)">${t.categoria_icone||''} ${t.categoria_nome}</div>`:''}
      </td>
      <td>${badge('#6366f1',TIPO_L[t.tipo]||t.tipo)}</td>
      <td>${badge(COR_PRIO[t.prioridade],t.prioridade)}</td>
      <td>${badge(COR_EST[t.estado],t.estado.replace('_',' '))}</td>
      <td style="font-size:12px">${t.atribuido_nome||'—'}</td>
      <td>${t.sla_violado?badge('#ef4444','⚠ Breach'):t.data_limite_resolucao?`<span style="font-size:11px;color:rgba(255,255,255,.3)">${fmtD(t.data_limite_resolucao)}</span>`:'—'}</td>
      <td style="font-size:12px;white-space:nowrap">${fmtD(t.criado_em)}</td>
    </tr>`).join('');
}

async function filtrarTicketsPor(campo, val) {
  const params = new URLSearchParams({limite:50,[campo]:val});
  const d = await api('/itsm/tickets?' + params);
  document.querySelector('#tabela-tickets tbody').innerHTML = renderLinhasTickets(d.tickets||[]);
  window._tickets = d.tickets||[];
}

function filtrarTickets(q) {
  const filtered = (window._tickets||[]).filter(t =>
    t.titulo?.toLowerCase().includes(q.toLowerCase()) ||
    t.numero?.toLowerCase().includes(q.toLowerCase())
  );
  document.querySelector('#tabela-tickets tbody').innerHTML = renderLinhasTickets(filtered);
}

async function renderProblemas() {
  const rows = await api('/itsm/problemas');
  const c = document.getElementById('conteudo');
  c.innerHTML = `<div class="card">
    <div class="card-header"><span class="card-title">Gestão de Problemas</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Número</th><th>Título</th><th>Prioridade</th><th>Estado</th><th>Responsável</th><th>Criado</th></tr></thead>
      <tbody>${rows.length ? rows.map(p=>`<tr>
        <td style="font-family:monospace;font-size:12px">${p.numero}</td>
        <td style="font-weight:500">${p.titulo}</td>
        <td>${badge(COR_PRIO[p.prioridade],p.prioridade)}</td>
        <td style="font-size:12px;text-transform:capitalize">${p.estado.replace('_',' ')}</td>
        <td style="font-size:12px">${p.responsavel_nome||'—'}</td>
        <td style="font-size:12px">${fmtD(p.criado_em)}</td>
      </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,.25)">Sem problemas registados</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

async function renderMudancas() {
  const rows = await api('/itsm/mudancas');
  const c = document.getElementById('conteudo');
  c.innerHTML = `<div class="card">
    <div class="card-header"><span class="card-title">Change Management</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Número</th><th>Título</th><th>Tipo</th><th>Risco</th><th>Estado</th><th>Janela</th></tr></thead>
      <tbody>${rows.length ? rows.map(m=>`<tr>
        <td style="font-family:monospace;font-size:12px">${m.numero}</td>
        <td style="font-weight:500">${m.titulo}</td>
        <td style="font-size:12px;text-transform:capitalize">${m.tipo}</td>
        <td>${badge(m.risco==='critico'?'#ef4444':m.risco==='alto'?'#f97316':m.risco==='medio'?'#f59e0b':'#10b981',m.risco)}</td>
        <td style="font-size:12px;text-transform:capitalize">${m.estado.replace('_',' ')}</td>
        <td style="font-size:12px">${m.janela_inicio?fmtD(m.janela_inicio):'—'}</td>
      </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,.25)">Sem mudanças registadas</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

async function renderConhecimento() {
  const rows = await api('/itsm/conhecimento');
  const c = document.getElementById('conteudo');
  if (!rows.length) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><div>Base de conhecimento vazia.</div></div>`;
    return;
  }
  c.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">
    ${rows.map(a=>`<div class="card" style="padding:16px">
      <div style="display:flex;gap:8px;margin-bottom:8px">${badge('#6366f1',a.tipo)}${a.categoria_nome?`<span style="font-size:11px;color:rgba(255,255,255,.3)">${a.categoria_nome}</span>`:''}</div>
      <div style="font-weight:600;font-size:14px;color:#fff;margin-bottom:6px">${a.titulo}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.35);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${a.conteudo}</div>
      <div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:rgba(255,255,255,.25)">
        <span>👁 ${a.visualizacoes}</span><span>👍 ${a.util_sim}</span><span>👎 ${a.util_nao}</span>
      </div>
    </div>`).join('')}
  </div>`;
}

async function renderRelatorios() {
  const r = await api('/itsm/relatorios');
  const s = r.resumo;
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="kpi-valor">${s.total}</div><div class="kpi-label">Total tickets</div></div>
      <div class="kpi"><div class="kpi-valor" style="color:#10b981">${s.resolvidos}</div><div class="kpi-label">Resolvidos</div></div>
      <div class="kpi"><div class="kpi-valor" style="color:#6EE7B7">${s.mttr_min}min</div><div class="kpi-label">MTTR</div></div>
      <div class="kpi"><div class="kpi-valor" style="color:${s.sla_pct>=95?'#10b981':'#f59e0b'}">${s.sla_pct}%</div><div class="kpi-label">SLA Compliance</div><div class="kpi-sub">CSAT: ${s.csat}/5</div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Por Técnico</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Técnico</th><th>Total</th><th>MTTR</th><th>SLA OK</th></tr></thead>
        <tbody>${(r.por_tecnico||[]).map(t=>`<tr>
          <td style="font-size:12px">${t.nome_completo}</td>
          <td style="font-size:12px">${t.total}</td>
          <td style="font-size:12px">${t.mttr_medio?Math.round(t.mttr_medio)+'min':'—'}</td>
          <td style="font-size:12px">${t.sla_ok}</td>
        </tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:20px;color:rgba(255,255,255,.25)">Sem dados</td></tr>'}
        </tbody>
      </table></div>
    </div>`;
}

async function abrirDetalhe(id) {
  const t = await api('/itsm/tickets/' + id);
  ticketActual = t;
  const slaViolado = t.data_limite_resolucao && new Date(t.data_limite_resolucao) < new Date() && !['resolvido','fechado','cancelado'].includes(t.estado);
  document.getElementById('detalhe-titulo').innerHTML = `
    <span style="font-size:12px;color:rgba(255,255,255,.3);display:block;margin-bottom:4px">${t.numero}</span>
    ${t.titulo}
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      ${badge(COR_PRIO[t.prioridade],t.prioridade.toUpperCase())}
      ${badge(COR_EST[t.estado],t.estado.replace('_',' ').toUpperCase())}
      ${badge('#6366f1',TIPO_L[t.tipo]||t.tipo)}
      ${slaViolado?badge('#ef4444','⚠ SLA VIOLADO'):''}
    </div>`;

  const comentariosHtml = (t.comentarios||[]).map(c=>`
    <div class="actividade ${c.tipo==='nota_interna'?'nota':c.tipo==='sistema'?'sistema':''}">
      <div class="act-header">
        <span class="act-autor">${c.autor_nome||'Sistema'}</span>
        ${c.tipo==='nota_interna'?'<span class="nota-interna">NOTA INTERNA</span>':''}
        ${c.tipo==='sistema'?'<span style="font-size:10px;color:#818CF8;font-weight:600">SISTEMA</span>':''}
        <span class="act-data">${fmtDT(c.criado_em)}</span>
      </div>
      <div class="act-texto">${c.conteudo}</div>
    </div>`).join('') || '<div style="color:rgba(255,255,255,.25);font-size:13px;text-align:center;padding:20px">Sem actividade</div>';

  document.getElementById('detalhe-corpo').innerHTML = `
    <div class="detail-main">
      ${t.descricao?`<div style="margin-bottom:20px">
        <div class="form-label" style="margin-bottom:8px">Descrição</div>
        <div style="font-size:14px;color:rgba(255,255,255,.65);line-height:1.6;white-space:pre-wrap">${t.descricao}</div>
      </div>`:''}
      <div class="form-label" style="margin-bottom:8px">Actividade (${t.comentarios?.length||0})</div>
      <div style="max-height:280px;overflow-y:auto;margin-bottom:12px">${comentariosHtml}</div>
      <textarea class="form-input" id="d-comentario" placeholder="Adicionar comentário..." style="margin-bottom:8px"></textarea>
      <div style="display:flex;gap:8px;align-items:center">
        <label style="display:flex;gap:6px;align-items:center;font-size:12px;color:rgba(255,255,255,.3);cursor:pointer">
          <input type="checkbox" id="d-nota-interna"/> Nota interna
        </label>
        <button class="btn-primary" style="margin-left:auto" onclick="enviarComentario()">Comentar</button>
      </div>
    </div>
    <div class="detail-side">
      <div>
        <label class="form-label">Estado</label>
        <select class="form-select" id="d-estado" style="font-size:13px">
          ${['aberto','em_progresso','pendente','resolvido','fechado','cancelado'].map(s=>`<option value="${s}" ${t.estado===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="form-label">Atribuído a</label>
        <select class="form-select" id="d-atribuido" style="font-size:13px">
          <option value="">Não atribuído</option>
          ${utilizadores.map(u=>`<option value="${u.id}" ${t.atribuido_a===u.id?'selected':''}>${u.nome_completo}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" onclick="guardarAlteracoes()" style="font-size:13px">Guardar alterações</button>
      <div style="border-top:1px solid rgba(255,255,255,.07);padding-top:14px">
        ${[
          ['Categoria', t.categoria_icone?`${t.categoria_icone} ${t.categoria_nome}`:t.categoria_nome||'—'],
          ['Solicitante', t.solicitante_nome||'—'],
          ['Criado por', t.criado_por_nome||'—'],
          ['Criado em', fmtDT(t.criado_em)],
          ['SLA Resposta', fmtDT(t.data_limite_resposta)],
          ['SLA Resolução', fmtDT(t.data_limite_resolucao)],
        ].map(([k,v])=>`<div class="detail-field"><div class="detail-field-label">${k}</div><div class="detail-field-val">${v}</div></div>`).join('')}
      </div>
    </div>`;

  document.getElementById('modal-detalhe').style.display = 'flex';
}

function fecharDetalhe() {
  document.getElementById('modal-detalhe').style.display = 'none';
  ticketActual = null;
}

async function enviarComentario() {
  const conteudo = document.getElementById('d-comentario').value.trim();
  if (!conteudo || !ticketActual) return;
  const nota = document.getElementById('d-nota-interna').checked;
  try {
    await api('/itsm/tickets/' + ticketActual.id + '/comentarios', {
      method: 'POST',
      body: JSON.stringify({ conteudo, nota_interna: nota })
    });
    await abrirDetalhe(ticketActual.id);
  } catch(e) { alert('Erro: ' + e.message); }
}

async function guardarAlteracoes() {
  if (!ticketActual) return;
  const estado = document.getElementById('d-estado').value;
  const atribuido = document.getElementById('d-atribuido').value;
  try {
    await api('/itsm/tickets/' + ticketActual.id, {
      method: 'PUT',
      body: JSON.stringify({ estado, atribuido_a: atribuido || null })
    });
    await abrirDetalhe(ticketActual.id);
    carregarTab();
  } catch(e) { alert('Erro: ' + e.message); }
}

function abrirModalNovo() { document.getElementById('modal-novo').style.display = 'flex'; }
function fecharModalNovo() { document.getElementById('modal-novo').style.display = 'none'; }

async function criarTicket() {
  const titulo = document.getElementById('n-titulo').value.trim();
  if (!titulo) return alert('Título obrigatório');
  try {
    await api('/itsm/tickets', {
      method: 'POST',
      body: JSON.stringify({
        tipo: document.getElementById('n-tipo').value,
        titulo,
        descricao: document.getElementById('n-descricao').value,
        prioridade: document.getElementById('n-prioridade').value,
        categoria_id: document.getElementById('n-categoria').value || null,
        atribuido_a: document.getElementById('n-atribuido').value || null,
      })
    });
    fecharModalNovo();
    document.getElementById('n-titulo').value = '';
    document.getElementById('n-descricao').value = '';
    await setup();
    carregarTab();
  } catch(e) { alert('Erro: ' + e.message); }
}

async function setup() {
  try { await api('/itsm/setup', {method:'POST'}); } catch(e) {}
}

setup().then(() => init());
</script>

</html>
