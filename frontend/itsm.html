<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITSM — NexEdge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --sb:#0F0F1E;--bg:#0D0D1A;--s1:#13131F;--s2:#1A1A2E;--s3:#1F1F35;
      --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.12);
      --t1:rgba(255,255,255,.9);--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.3);
      --in:#4F46E5;--vi:#7C3AED;--ho:rgba(79,70,229,.12);--ac:rgba(79,70,229,.22);
      --gr:#10B981;--re:#EF4444;--am:#F59E0B;--bl:#3B82F6;
    }
    [data-theme=light]{
      --sb:#0F0F1E;--bg:#F1F5F9;--s1:#FFFFFF;--s2:#F8FAFC;--s3:#E2E8F0;
      --b1:rgba(0,0,0,.07);--b2:rgba(0,0,0,.12);
      --t1:#0F172A;--t2:#475569;--t3:#94A3B8;
      --ho:rgba(79,70,229,.06);--ac:rgba(79,70,229,.1);
    }
    body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;font-size:14px}

    /* ── SIDEBAR ── */
    .sb{width:240px;background:var(--sb);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:20}
    .sb-logo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
    .sb-logo-ic{width:32px;height:32px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:0 2px 8px rgba(79,70,229,.4)}
    .sb-logo-tx{color:#fff;font-weight:700;font-size:14px}
    .sb-logo-sub{color:rgba(165,180,252,.4);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
    .sb-section{padding:16px 10px 4px;font-size:9px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.18);text-transform:uppercase}
    .sb-nav{flex:1;padding:8px 6px}
    .sb-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.45);text-decoration:none;font-size:12.5px;font-weight:400;border-left:2px solid transparent;transition:all .12s;margin:1px 0}
    .sb-item:hover{background:rgba(79,70,229,.1);color:rgba(255,255,255,.85)}
    .sb-item.act{background:rgba(79,70,229,.18);border-left-color:#6366f1;color:#fff;font-weight:500}
    .sb-item.ext{color:rgba(129,140,248,.6)}
    .sb-item.ext:hover{color:#a5b4fc;background:rgba(99,102,241,.1)}
    .sb-user{border-top:1px solid rgba(255,255,255,.05);padding:10px 8px;flex-shrink:0;display:flex;align-items:center;gap:8px}
    .sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
    .sb-uname{color:rgba(255,255,255,.8);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sb-urole{color:rgba(255,255,255,.28);font-size:10px}

    /* ── MAIN ── */
    .main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
    .topbar{height:54px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:10;flex-shrink:0}
    .topbar-title{font-size:15px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
    .topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
    .content{padding:24px;flex:1}

    /* ── BOTÕES ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;border:none;transition:all .15s}
    .btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.35)}
    .btn-primary:hover{box-shadow:0 4px 16px rgba(79,70,229,.5);transform:translateY(-1px)}
    .btn-secondary{background:var(--s2);color:var(--t2);border:1px solid var(--b2)}
    .btn-secondary:hover{background:var(--s3);color:var(--t1)}
    .btn-danger{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
    .btn-sm{padding:5px 12px;font-size:12px}
    .btn-ghost{background:none;border:1px solid var(--b2);color:var(--t3)}
    .btn-ghost:hover{background:var(--s2);color:var(--t1)}

    /* ── TABS ── */
    .tabs{display:flex;gap:0;border-bottom:1px solid var(--b1);margin-bottom:24px}
    .tab{padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);transition:all .15s;font-family:inherit;white-space:nowrap}
    .tab:hover{color:var(--t2)}
    .tab.act{border-bottom-color:#6366f1;color:#818CF8;font-weight:600}

    /* ── KPI CARDS ── */
    .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
    .kpi{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:20px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
    .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
    .kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px}
    .kpi-val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:2px}
    .kpi-label{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
    .kpi-trend{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
    .kpi-accent{position:absolute;right:-10px;top:-10px;width:80px;height:80px;border-radius:50%;opacity:.06}

    /* ── CARDS ── */
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden}
    .card-h{padding:16px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
    .card-title{font-size:13px;font-weight:600;color:var(--t1);display:flex;align-items:center;gap:8px}
    .card-body{padding:20px}

    /* ── TABELA ── */
    .tbl{width:100%;border-collapse:collapse;font-size:13px}
    .tbl thead tr{background:var(--s2)}
    .tbl th{padding:10px 16px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);white-space:nowrap;border-bottom:1px solid var(--b1)}
    .tbl td{padding:12px 16px;border-bottom:1px solid var(--b1);color:var(--t2);vertical-align:middle}
    .tbl tbody tr:hover td{background:var(--ho);color:var(--t1)}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr{cursor:pointer;transition:background .1s}

    /* ── BADGES ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap}
    .badge-dot{width:6px;height:6px;border-radius:50%}

    /* ── FORMS ── */
    .fi{width:100%;padding:9px 12px;font-size:13px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--t1);outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s}
    .fi:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
    .fi::placeholder{color:var(--t3)}
    select.fi{cursor:pointer}
    textarea.fi{resize:vertical;min-height:80px}
    .fl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:5px}
    .fg{display:flex;flex-direction:column;gap:4px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

    /* ── MODAL ── */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
    .modal{background:var(--s1);border:1px solid var(--b2);border-radius:16px;width:100%;animation:slideIn .2s ease-out}
    .modal-sm{max-width:520px;margin:auto}
    .modal-md{max-width:680px;margin:auto}
    .modal-lg{max-width:900px;margin:auto}
    .modal-h{padding:20px 24px;border-bottom:1px solid var(--b1);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .modal-ht{font-size:16px;font-weight:700;color:var(--t1)}
    .modal-close{background:none;border:none;cursor:pointer;color:var(--t3);font-size:22px;line-height:1;padding:0;flex-shrink:0}
    .modal-close:hover{color:var(--t1)}
    .modal-b{padding:24px;display:flex;flex-direction:column;gap:16px}
    .modal-f{padding:16px 24px;border-top:1px solid var(--b1);display:flex;gap:8px;justify-content:flex-end}
    @keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

    /* ── KANBAN ── */
    .kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;min-height:500px}
    .k-col{flex-shrink:0;width:280px;background:var(--s2);border-radius:12px;display:flex;flex-direction:column}
    .k-col-h{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b1)}
    .k-col-title{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
    .k-col-count{background:var(--s3);color:var(--t3);font-size:11px;font-weight:600;padding:2px 7px;border-radius:9999px}
    .k-col-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:calc(100vh - 240px)}
    .k-card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
    .k-card:hover{border-color:rgba(99,102,241,.3);box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(-1px)}
    .k-card-num{font-size:10px;color:var(--t3);font-family:monospace;margin-bottom:4px}
    .k-card-title{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:8px;line-height:1.4}
    .k-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

    /* ── CATÁLOGO ── */
    .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
    .cat-item{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:24px;cursor:pointer;transition:all .2s;text-align:center}
    .cat-item:hover{border-color:rgba(99,102,241,.4);box-shadow:0 8px 24px rgba(0,0,0,.15);transform:translateY(-3px)}
    .cat-icon{font-size:36px;margin-bottom:12px}
    .cat-name{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:4px}
    .cat-desc{font-size:12px;color:var(--t3);line-height:1.4}
    .cat-sla{font-size:11px;color:#818CF8;margin-top:8px;font-weight:500}

    /* ── DETALHE ── */
    .det-grid{display:grid;grid-template-columns:1fr 300px}
    .det-main{padding:24px;border-right:1px solid var(--b1)}
    .det-side{padding:20px;display:flex;flex-direction:column;gap:16px}
    .act-item{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px;margin-bottom:8px}
    .act-item.nota{background:rgba(245,158,11,.05);border-color:rgba(245,158,11,.2)}
    .act-item.sys{background:rgba(99,102,241,.05);border-color:rgba(99,102,241,.15)}
    .act-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
    .act-autor{font-weight:600;color:var(--t1)}
    .act-data{color:var(--t3);margin-left:auto;font-size:11px}
    .act-txt{font-size:13px;color:var(--t2);line-height:1.5}

    /* ── MÉTRICAS ── */
    .metric-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b1)}
    .metric-row:last-child{border-bottom:none}
    .metric-bar{flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
    .metric-fill{height:100%;border-radius:3px;transition:width .5s ease}
    .progress-ring{width:80px;height:80px}

    /* ── UTILS ── */
    .flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
    .gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
    .mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mt-2{margin-top:8px}.mt-4{margin-top:16px}
    .text-xs{font-size:11px}.text-sm{font-size:12px}.font-600{font-weight:600}.font-700{font-weight:700}
    .c-t1{color:var(--t1)}.c-t2{color:var(--t2)}.c-t3{color:var(--t3)}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .w-full{width:100%}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .filters .fi{width:auto}
    .empty{text-align:center;padding:60px 20px;color:var(--t3)}
    .empty-icon{font-size:48px;margin-bottom:12px}
    .empty-title{font-size:15px;font-weight:600;color:var(--t2);margin-bottom:4px}
    .tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;background:var(--s3);color:var(--t2)}
    .divider{height:1px;background:var(--b1);margin:16px 0}
    .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
    .sla-ok{color:#10b981}.sla-warn{color:#f59e0b}.sla-bad{color:#ef4444}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:4px}
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sb" id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-ic">N</div>
    <div><div class="sb-logo-tx">nexedge</div><div class="sb-logo-sub">ITSM Platform</div></div>
  </div>
  <nav class="sb-nav" id="sb-nav"></nav>
  <div class="sb-user">
    <div class="sb-av" id="sb-av">U</div>
    <div style="flex:1;min-width:0"><div class="sb-uname" id="sb-name">Utilizador</div><div class="sb-urole" id="sb-role">admin</div></div>
    <button onclick="logout()" title="Sair" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.25);padding:4px;border-radius:6px;display:flex" onmouseover="this.style.color='#fca5a5'" onmouseout="this.style.color='rgba(255,255,255,.25)'">
      <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title">
      <svg width="18" height="18" fill="none" stroke="#818CF8" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>
      ITSM Service Management
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="theme-btn">☀ Claro</button>
      <button class="btn btn-primary" onclick="abrirNovoTicket()">+ Novo Ticket</button>
    </div>
  </div>
  <div class="content">
    <div class="tabs" id="tabs">
      <button class="tab act" onclick="tab('dashboard',this)">📊 Dashboard</button>
      <button class="tab" onclick="tab('kanban',this)">📋 Kanban</button>
      <button class="tab" onclick="tab('tickets',this)">🎫 Tickets</button>
      <button class="tab" onclick="tab('catalogo',this)">🛒 Catálogo</button>
      <button class="tab" onclick="tab('problemas',this)">🔍 Problemas</button>
      <button class="tab" onclick="tab('mudancas',this)">🔄 Mudanças</button>
      <button class="tab" onclick="tab('cmdb',this)">🖥 CMDB</button>
      <button class="tab" onclick="tab('conhecimento',this)">📚 Knowledge</button>
      <button class="tab" onclick="tab('relatorios',this)">📈 Relatórios</button>
    </div>
    <div id="conteudo"></div>
  </div>
</div>

<!-- MODAL NOVO TICKET -->
<div id="m-novo" class="ov" style="display:none">
  <div class="modal modal-md">
    <div class="modal-h">
      <div>
        <div class="modal-ht">Novo Ticket</div>
        <div style="font-size:12px;color:var(--t3);margin-top:2px">O SLA será calculado automaticamente</div>
      </div>
      <button class="modal-close" onclick="fechar('m-novo')">×</button>
    </div>
    <div class="modal-b">
      <div class="g2">
        <div class="fg"><label class="fl">Tipo</label>
          <select class="fi" id="n-tipo">
            <option value="request">📋 Pedido de Serviço</option>
            <option value="incident">🚨 Incidente</option>
            <option value="problem">🔍 Problema</option>
            <option value="change">🔄 Mudança</option>
            <option value="task">✅ Tarefa</option>
          </select></div>
        <div class="fg"><label class="fl">Prioridade</label>
          <select class="fi" id="n-pri">
            <option value="media">🟡 Média</option>
            <option value="alta">🟠 Alta</option>
            <option value="critica">🔴 Crítica</option>
            <option value="baixa">⚪ Baixa</option>
          </select></div>
      </div>
      <div class="fg"><label class="fl">Título *</label>
        <input class="fi" id="n-titulo" placeholder="Descreve brevemente o problema ou pedido"/></div>
      <div class="fg"><label class="fl">Descrição detalhada</label>
        <textarea class="fi" id="n-desc" rows="4" placeholder="Passos para reproduzir, impacto no negócio, informação adicional..."></textarea></div>
      <div class="g2">
        <div class="fg"><label class="fl">Categoria</label><select class="fi" id="n-cat"></select></div>
        <div class="fg"><label class="fl">Atribuir a</label><select class="fi" id="n-atrib"></select></div>
      </div>
      <div class="g2">
        <div class="fg"><label class="fl">Impacto</label>
          <select class="fi" id="n-impacto">
            <option value="individual">👤 Individual</option>
            <option value="departamento">🏢 Departamento</option>
            <option value="empresa">🏭 Empresa</option>
            <option value="critico">⚠️ Crítico</option>
          </select></div>
        <div class="fg"><label class="fl">Urgência</label>
          <select class="fi" id="n-urgencia">
            <option value="normal">⏱ Normal</option>
            <option value="urgente">⚡ Urgente</option>
            <option value="imediato">🚨 Imediato</option>
            <option value="planeado">📅 Planeado</option>
          </select></div>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="fechar('m-novo')">Cancelar</button>
      <button class="btn btn-primary" onclick="criarTicket()">🎫 Criar Ticket</button>
    </div>
  </div>
</div>

<!-- MODAL DETALHE TICKET -->
<div id="m-det" class="ov" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-h" id="det-h"></div>
    <div class="det-grid" id="det-body"></div>
  </div>
</div>

<!-- MODAL CATÁLOGO -->

<script>
// ── CONSTANTES ──
const COR_PRIO = {critica:'#ef4444',alta:'#f97316',media:'#f59e0b',baixa:'#6b7280'};
const COR_EST  = {aberto:'#6366f1',em_progresso:'#3b82f6',pendente:'#f59e0b',resolvido:'#10b981',fechado:'#6b7280',cancelado:'#ef4444'};
const TIPO_L   = {incident:'Incidente',request:'Pedido',problem:'Problema',change:'Mudança',task:'Tarefa'};
const EST_L    = {aberto:'Aberto',em_progresso:'Em Progresso',pendente:'Pendente',resolvido:'Resolvido',fechado:'Fechado',cancelado:'Cancelado'};
const ICO_PRIO = {critica:'🔴',alta:'🟠',media:'🟡',baixa:'⚪'};

const SB_MENU = [
  {sec:'ITSM'},
  {path:'dashboard',label:'Dashboard',ico:'📊'},{path:'kanban',label:'Kanban',ico:'📋'},
  {path:'tickets',label:'Tickets',ico:'🎫'},{path:'catalogo',label:'Catálogo Serviços',ico:'🛒'},
  {sec:'GESTÃO'},
  {path:'problemas',label:'Problemas',ico:'🔍'},{path:'mudancas',label:'Mudanças',ico:'🔄'},
  {path:'cmdb',label:'CMDB / Assets',ico:'🖥'},{path:'conhecimento',label:'Knowledge Base',ico:'📚'},
  {sec:'ANÁLISE'},
  {path:'relatorios',label:'Relatórios',ico:'📈'},
  {sec:'PLATAFORMA'},
  {path:'erp',label:'Voltar ao ERP',ico:'←',ext:true},
];

// ── TEMA ──
let tema = localStorage.getItem('ne-theme') || 'dark';
function aplicarTema(){
  document.documentElement.setAttribute('data-theme',tema);
  document.getElementById('theme-btn').textContent = tema==='dark'?'☀ Claro':'🌙 Escuro';
}
function toggleTheme(){ tema=tema==='dark'?'light':'dark'; localStorage.setItem('ne-theme',tema); aplicarTema(); }
aplicarTema();

// ── AUTH ──
function getToken(){
  try{
    const t=localStorage.getItem('access_token'); if(t) return t;
    const r=localStorage.getItem('rh-auth'); if(r){const p=JSON.parse(r);if(p?.state?.token)return p.state.token;}
  }catch(e){}
  return null;
}
function getUser(){try{const r=localStorage.getItem('rh-auth');if(r)return JSON.parse(r)?.state?.utilizador;}catch(e){}return null;}
function logout(){localStorage.removeItem('access_token');window.location.href='/';}

let TOKEN=getToken(), cats=[], users=[], tabAtual='dashboard', ticketAtual=null, catSel=null;

// ── API ──
async function api(path,opts={}){
  if(!TOKEN){TOKEN=getToken();}
  if(!TOKEN){window.location.href='/';return null;}
  const r=await fetch('/api'+path,{headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...(opts.headers||{})},method:opts.method||'GET',body:opts.body});
  if(r.status===401){window.location.href='/';return null;}
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

// ── UTILS ──
function bd(cor,label,dot=false){return `<span class="badge" style="background:${cor}18;color:${cor};border:1px solid ${cor}30">${dot?`<span class="badge-dot" style="background:${cor}"></span>`:''}${label}</span>`;}
function fD(d){return d?new Date(d).toLocaleDateString('pt-PT'):'—';}
function fDT(d){return d?new Date(d).toLocaleString('pt-PT'):'—';}
function fMin(m){if(!m)return'—';if(m<60)return m+'min';if(m<1440)return Math.round(m/60)+'h';return Math.round(m/1440)+'d';}
function slaClr(pct){return pct>=95?'#10b981':pct>=80?'#f59e0b':'#ef4444';}
function fechar(id){document.getElementById(id).style.display='none';}

// ── SIDEBAR ──
function renderSB(){
  const u=getUser();
  if(u){
    document.getElementById('sb-av').textContent=(u.nome_completo||u.nome||'U')[0].toUpperCase();
    document.getElementById('sb-name').textContent=u.nome_completo||u.nome||'Utilizador';
    document.getElementById('sb-role').textContent=u.perfil||'admin';
  }
  const nav=document.getElementById('sb-nav');
  nav.innerHTML=SB_MENU.map(item=>{
    if(item.sec) return `<div class="sb-section">${item.sec}</div>`;
    if(item.ext) return `<a class="sb-item ext" href="http://localhost:5173/">${item.ico} ${item.label}</a>`;
    return `<a class="sb-item${tabAtual===item.path?' act':''}" href="#" onclick="tab('${item.path}',null);return false;">${item.ico} ${item.label}</a>`;
  }).join('');
}

// ── TAB ──
function tab(t,el){
  tabAtual=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('act'));
  if(el) el.classList.add('act');
  else{
    const tabs=document.querySelectorAll('.tab');
    tabs.forEach(x=>{if(x.textContent.toLowerCase().includes(t.slice(0,4))) x.classList.add('act');});
  }
  renderSB();
  carregar();
}

async function carregar(){
  const c=document.getElementById('conteudo');
  c.innerHTML='<div style="padding:60px;text-align:center;color:var(--t3)"><div style="font-size:32px;margin-bottom:12px">⟳</div>A carregar...</div>';
  try{
    if(tabAtual==='dashboard')    await rDashboard();
    else if(tabAtual==='kanban')  await rKanban();
    else if(tabAtual==='tickets') await rTickets();
    else if(tabAtual==='catalogo') await rCatalogo();
    else if(tabAtual==='problemas') await rProblemas();
    else if(tabAtual==='mudancas') await rMudancas();
    else if(tabAtual==='cmdb')    await rCMDB();
    else if(tabAtual==='conhecimento') await rConhecimento();
    else if(tabAtual==='relatorios') await rRelatorios();
  }catch(e){c.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Erro</div><div style="font-size:13px">${e.message}</div></div>`;}
}

// ── DASHBOARD ──
async function rDashboard(){
  const d=await api('/itsm/dashboard');
  const k=d.kpis;
  const c=document.getElementById('conteudo');
  c.innerHTML=`
    <div class="kpi-grid">
      ${kpi('🎫','Tickets Abertos',k.abertos,'#6366f1','vs ontem')}
      ${kpi('🚨','Urgentes',k.urgentes,k.urgentes>0?'#ef4444':'#10b981','críticos + altos')}
      ${kpi('⚠️','SLA Breach',k.sla_breach,k.sla_breach>0?'#f97316':'#10b981','expirados')}
      ${kpi('⏱','MTTR',fMin(k.mttr_min),'#818CF8','tempo médio resolução')}
      ${kpi('⭐','CSAT',k.satisfacao_media+'/5',parseFloat(k.satisfacao_media||0)>=4?'#10b981':parseFloat(k.satisfacao_media||0)>=3?'#f59e0b':'#ef4444',k.satisfacao_total+' avaliações')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="card">
        <div class="card-h"><div class="card-title">SLA Compliance — 30 dias</div></div>
        <div class="card-body">
          ${slaBar('Resposta',k.sla_resposta_pct)}
          ${slaBar('Resolução',k.sla_resolucao_pct)}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div class="card-title">Por Estado</div></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:8px">
          ${(d.por_estado||[]).map(e=>`
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:8px;height:8px;border-radius:50%;background:${COR_EST[e.estado]||'#6b7280'};flex-shrink:0;display:inline-block"></span>
              <span style="font-size:12px;color:var(--t2);flex:1;text-transform:capitalize">${e.estado.replace('_',' ')}</span>
              <span style="font-size:12px;font-weight:600;color:var(--t1)">${e.total}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div class="card-title">Por Tipo</div></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:8px">
          ${(d.por_tipo||[]).map(t=>`
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:13px">${t.tipo==='incident'?'🚨':t.tipo==='request'?'📋':t.tipo==='problem'?'🔍':t.tipo==='change'?'🔄':'✅'}</span>
              <span style="font-size:12px;color:var(--t2);flex:1">${TIPO_L[t.tipo]||t.tipo}</span>
              <span style="font-size:12px;font-weight:600;color:var(--t1)">${t.total}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-h">
        <div class="card-title">🔥 Tickets Recentes</div>
        <button class="btn btn-ghost btn-sm" onclick="tab('tickets',null)">Ver todos →</button>
      </div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Número</th><th>Título</th><th>Tipo</th><th>Prioridade</th><th>Estado</th><th>Atribuído</th><th>SLA</th></tr></thead>
          <tbody>${(d.recentes||[]).map(t=>linhaTicket(t)).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

function kpi(ico,label,valor,cor,sub){
  return `<div class="kpi">
    <div class="kpi-accent" style="background:${cor}"></div>
    <div class="kpi-icon" style="background:${cor}15">${ico}</div>
    <div class="kpi-val" style="color:${cor}">${valor??'—'}</div>
    <div class="kpi-label">${label}</div>
    ${sub?`<div class="kpi-trend" style="color:var(--t3)">${sub}</div>`:''}
  </div>`;
}

function slaBar(label,pct){
  const cor=slaClr(pct);
  return `<div style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
      <span style="color:var(--t2);font-weight:500">${label}</span>
      <span style="font-weight:700;color:${cor}">${pct}%</span>
    </div>
    <div style="height:8px;background:var(--s3);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${cor};border-radius:4px;transition:width .5s"></div>
    </div>
  </div>`;
}

function linhaTicket(t){
  const slaV=t.sla_violado||t.data_limite_resolucao&&new Date(t.data_limite_resolucao)<new Date()&&!['resolvido','fechado','cancelado'].includes(t.estado);
  return `<tr onclick="abrirDetalhe('${t.id}')">
    <td style="font-family:monospace;font-size:11px;color:var(--t3)">${t.numero}</td>
    <td style="max-width:220px"><div class="truncate font-600" style="color:var(--t1)">${t.titulo}</div>${t.categoria_nome?`<div class="text-xs c-t3">${t.categoria_icone||''} ${t.categoria_nome}</div>`:''}</td>
    <td>${bd('#6366f1',TIPO_L[t.tipo]||t.tipo)}</td>
    <td>${bd(COR_PRIO[t.prioridade],ICO_PRIO[t.prioridade]+' '+t.prioridade,false)}</td>
    <td>${bd(COR_EST[t.estado],EST_L[t.estado]||t.estado,true)}</td>
    <td style="font-size:12px">${t.atribuido_nome?`<div style="display:flex;align-items:center;gap:6px"><div class="avatar" style="width:22px;height:22px;font-size:10px">${t.atribuido_nome[0]}</div>${t.atribuido_nome}</div>`:'<span style="color:var(--t3)">—</span>'}</td>
    <td>${slaV?bd('#ef4444','⚠ Breach'):t.data_limite_resolucao?`<span class="text-xs c-t3">${fD(t.data_limite_resolucao)}</span>`:'—'}</td>
  </tr>`;
}

// ── KANBAN ──
async function rKanban(){
  const [dados,grupos] = await Promise.all([
    api('/itsm/tickets?limite=200'),
    api('/itsm/grupos').catch(()=>[]),
  ]);
  const tickets=dados?.tickets||[];
  const colunas=[
    {id:'aberto',label:'Aberto',cor:'#6366f1'},
    {id:'em_progresso',label:'Em Progresso',cor:'#3b82f6'},
    {id:'pendente',label:'Pendente',cor:'#f59e0b'},
    {id:'resolvido',label:'Resolvido',cor:'#10b981'},
  ];
  document.getElementById('conteudo').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="display:flex;gap:8px">
        <select class="fi" style="width:160px" onchange="filtroKanban('prioridade',this.value)">
          <option value="">Todas prioridades</option>
          ${['critica','alta','media','baixa'].map(p=>`<option value="${p}">${ICO_PRIO[p]} ${p}</option>`).join('')}
        </select>
        <select class="fi" style="width:160px" onchange="filtroKanban('atribuido',this.value)">
          <option value="">Todos os agentes</option>
          ${users.map(u=>`<option value="${u.id}">${u.nome_completo}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:12px;color:var(--t3)">${tickets.length} tickets</div>
    </div>
    <div class="kanban" id="kanban-board">
      ${colunas.map(col=>{
        const its=tickets.filter(t=>t.estado===col.id);
        return `<div class="k-col">
          <div class="k-col-h">
            <div class="k-col-title" style="color:${col.cor}">${col.label}</div>
            <span class="k-col-count">${its.length}</span>
          </div>
          <div class="k-col-body" id="k-${col.id}">
            ${its.map(t=>`
              <div class="k-card" onclick="abrirDetalhe('${t.id}')" style="border-left-color:${COR_PRIO[t.prioridade]}">
                <div class="k-card-num">${t.numero}</div>
                <div class="k-card-title">${t.titulo}</div>
                <div class="k-card-meta">
                  ${bd(COR_PRIO[t.prioridade],ICO_PRIO[t.prioridade]+' '+t.prioridade)}
                  ${t.categoria_nome?`<span class="tag">${t.categoria_icone||''} ${t.categoria_nome}</span>`:''}
                  ${t.atribuido_nome?`<div style="display:flex;align-items:center;gap:4px;margin-left:auto"><div class="avatar" style="width:20px;height:20px;font-size:10px">${t.atribuido_nome[0]}</div></div>`:''}
                </div>
                ${t.data_limite_resolucao?`<div style="margin-top:6px;font-size:10px;color:${t.sla_violado?'#ef4444':'var(--t3)'}">⏱ ${fD(t.data_limite_resolucao)}</div>`:''}
              </div>`).join('')}
            ${!its.length?`<div style="text-align:center;padding:20px;color:var(--t3);font-size:12px">Sem tickets</div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  window._kanbanTickets=tickets;
}

function filtroKanban(campo,val){
  let its=window._kanbanTickets||[];
  if(val){
    if(campo==='prioridade') its=its.filter(t=>t.prioridade===val);
    if(campo==='atribuido') its=its.filter(t=>t.atribuido_a===val);
  }
  ['aberto','em_progresso','pendente','resolvido'].forEach(est=>{
    const col=document.getElementById('k-'+est);
    if(!col)return;
    const filtrado=its.filter(t=>t.estado===est);
    col.parentElement.querySelector('.k-col-count').textContent=filtrado.length;
    col.innerHTML=filtrado.map(t=>`
      <div class="k-card" onclick="abrirDetalhe('${t.id}')" style="border-left-color:${COR_PRIO[t.prioridade]}">
        <div class="k-card-num">${t.numero}</div>
        <div class="k-card-title">${t.titulo}</div>
        <div class="k-card-meta">
          ${bd(COR_PRIO[t.prioridade],ICO_PRIO[t.prioridade]+' '+t.prioridade)}
          ${t.atribuido_nome?`<div style="margin-left:auto"><div class="avatar" style="width:20px;height:20px;font-size:10px">${t.atribuido_nome[0]}</div></div>`:''}
        </div>
      </div>`).join('')||'<div style="text-align:center;padding:20px;color:var(--t3);font-size:12px">Sem tickets</div>';
  });
}

// ── TICKETS ──
async function rTickets(){
  const d=await api('/itsm/tickets?limite=100');
  const its=d?.tickets||[];
  window._tickets=its;
  document.getElementById('conteudo').innerHTML=`
    <div class="filters">
      <input class="fi" placeholder="🔍 Pesquisar número, título..." oninput="filtTickets(this.value)" style="width:260px"/>
      <select class="fi" onchange="reloadTickets('estado',this.value)" style="width:160px">
        <option value="">Todos os estados</option>
        ${Object.entries(EST_L).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
      <select class="fi" onchange="reloadTickets('tipo',this.value)" style="width:150px">
        <option value="">Todos os tipos</option>
        ${Object.entries(TIPO_L).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
      <select class="fi" onchange="reloadTickets('prioridade',this.value)" style="width:150px">
        <option value="">Todas prioridades</option>
        ${['critica','alta','media','baixa'].map(p=>`<option value="${p}">${ICO_PRIO[p]} ${p}</option>`).join('')}
      </select>
      <div style="margin-left:auto;font-size:12px;color:var(--t3);align-self:center">${its.length} tickets</div>
    </div>
    <div class="card">
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Número</th><th>Título</th><th>Tipo</th><th>Prioridade</th><th>Estado</th><th>Atribuído</th><th>SLA</th><th>Criado</th></tr></thead>
          <tbody id="tbl-tickets">${its.map(t=>linhaTicket(t)).join('')}${!its.length?`<tr><td colspan="8" class="empty">Sem tickets</td></tr>`:''}</tbody>
        </table>
      </div>
    </div>`;
}

function filtTickets(q){
  const f=(window._tickets||[]).filter(t=>t.titulo?.toLowerCase().includes(q.toLowerCase())||t.numero?.includes(q));
  document.getElementById('tbl-tickets').innerHTML=f.map(t=>linhaTicket(t)).join('')||'<tr><td colspan="8" class="empty">Sem resultados</td></tr>';
}

async function reloadTickets(campo,val){
  const p=new URLSearchParams({limite:100,[campo]:val});
  const d=await api('/itsm/tickets?'+p);
  window._tickets=d?.tickets||[];
  document.getElementById('tbl-tickets').innerHTML=window._tickets.map(t=>linhaTicket(t)).join('')||'<tr><td colspan="8" class="empty">Sem tickets</td></tr>';
}

// ── DETALHE TICKET ──
async function abrirDetalhe(id){
  if(!id||id.length<10)return; // Não é UUID
  const t=await api('/itsm/tickets/'+id);
  if(!t)return;
  ticketAtual=t;
  const slaV=t.data_limite_resolucao&&new Date(t.data_limite_resolucao)<new Date()&&!['resolvido','fechado','cancelado'].includes(t.estado);

  document.getElementById('det-h').innerHTML=`
    <div style="flex:1">
      <div style="font-size:11px;color:var(--t3);font-family:monospace;margin-bottom:6px">${t.numero}</div>
      <div style="font-size:16px;font-weight:700;color:var(--t1);margin-bottom:8px">${t.titulo}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${bd(COR_PRIO[t.prioridade],ICO_PRIO[t.prioridade]+' '+t.prioridade.toUpperCase())}
        ${bd(COR_EST[t.estado],EST_L[t.estado],true)}
        ${bd('#6366f1',TIPO_L[t.tipo]||t.tipo)}
        ${slaV?bd('#ef4444','⚠ SLA VIOLADO'):''}
        ${t.categoria_nome?`<span class="tag">${t.categoria_icone||''} ${t.categoria_nome}</span>`:''}
      </div>
    </div>
    <button class="modal-close" onclick="fechar('m-det')">×</button>`;

  const coms=(t.comentarios||[]).map(c=>`
    <div class="act-item ${c.tipo==='nota_interna'?'nota':c.tipo==='sistema'?'sys':''}">
      <div class="act-h">
        <div class="act-autor">${c.autor_nome||'Sistema'}</div>
        ${c.tipo==='nota_interna'?'<span style="font-size:10px;color:#f59e0b;font-weight:600;background:rgba(245,158,11,.1);padding:1px 6px;border-radius:4px">NOTA INTERNA</span>':''}
        ${c.tipo==='sistema'?'<span style="font-size:10px;color:#818CF8;font-weight:600;background:rgba(99,102,241,.1);padding:1px 6px;border-radius:4px">SISTEMA</span>':''}
        <div class="act-data">${fDT(c.criado_em)}</div>
      </div>
      <div class="act-txt">${c.conteudo}</div>
    </div>`).join('')||`<div style="text-align:center;padding:20px;color:var(--t3);font-size:13px">Sem actividade registada</div>`;

  document.getElementById('det-body').innerHTML=`
    <div class="det-main">
      ${t.descricao?`<div style="margin-bottom:20px"><div class="fl" style="margin-bottom:8px">Descrição</div><div style="font-size:13px;color:var(--t2);line-height:1.7;white-space:pre-wrap">${t.descricao}</div></div>`:''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="fl">Actividade (${t.comentarios?.length||0})</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);cursor:pointer"><input type="checkbox" id="d-nota"/> Nota interna</label>
      </div>
      <div style="max-height:260px;overflow-y:auto;margin-bottom:12px">${coms}</div>
      <textarea class="fi" id="d-com" placeholder="Escreve um comentário ou actualização de estado..." style="margin-bottom:8px"></textarea>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn btn-primary btn-sm" onclick="enviarCom()">💬 Comentar</button>
      </div>
    </div>
    <div class="det-side">
      <div class="fg"><label class="fl">Estado</label>
        <select class="fi" id="d-estado" style="font-size:13px">
          ${Object.entries(EST_L).map(([k,v])=>`<option value="${k}"${t.estado===k?' selected':''}>${v}</option>`).join('')}
        </select></div>
      <div class="fg"><label class="fl">Atribuído a</label>
        <select class="fi" id="d-atrib" style="font-size:13px">
          <option value="">Não atribuído</option>
          ${users.map(u=>`<option value="${u.id}"${t.atribuido_a===u.id?' selected':''}>${u.nome_completo}</option>`).join('')}
        </select></div>
      <button class="btn btn-primary w-full" onclick="guardarDet()">💾 Guardar</button>
      ${t.estado==='resolvido'&&!t.satisfacao?`
        <div style="background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:14px">
          <div style="font-size:12px;font-weight:600;color:var(--t1);margin-bottom:8px">⭐ Como foi o suporte?</div>
          <div style="display:flex;gap:6px;justify-content:center">
            ${[1,2,3,4,5].map(n=>`<button onclick="avaliar(${n})" style="background:none;border:none;cursor:pointer;font-size:24px;transition:transform .1s" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='none'">⭐</button>`).join('')}
          </div>
        </div>`:''}
      <div style="border-top:1px solid var(--b1);padding-top:14px;display:flex;flex-direction:column;gap:10px">
        ${[
          ['Categoria',t.categoria_icone?`${t.categoria_icone} ${t.categoria_nome}`:t.categoria_nome||'—'],
          ['Solicitante',t.solicitante_nome||'—'],
          ['Criado por',t.criado_por_nome||'—'],
          ['Criado em',fDT(t.criado_em)],
          ['Impacto',t.impacto||'—'],
          ['Urgência',t.urgencia||'—'],
          ['SLA Resposta',fDT(t.data_limite_resposta)],
          ['SLA Resolução',fDT(t.data_limite_resolucao)],
          ['Resolvido em',t.resolvido_em?fDT(t.resolvido_em):'—'],
          ['Tempo resolução',fMin(t.tempo_resolucao_min)],
        ].map(([k,v])=>`<div><div class="fl">${k}</div><div style="font-size:13px;color:var(--t2)">${v}</div></div>`).join('')}
      </div>
    </div>`;

  document.getElementById('m-det').style.display='flex';
}

async function enviarCom(){
  const c=document.getElementById('d-com')?.value?.trim();
  if(!c||!ticketAtual)return;
  await api('/itsm/tickets/'+ticketAtual.id+'/comentarios',{method:'POST',body:JSON.stringify({conteudo:c,nota_interna:document.getElementById('d-nota')?.checked})});
  await abrirDetalhe(ticketAtual.id);
}

async function guardarDet(){
  if(!ticketAtual)return;
  await api('/itsm/tickets/'+ticketAtual.id,{method:'PUT',body:JSON.stringify({estado:document.getElementById('d-estado')?.value,atribuido_a:document.getElementById('d-atrib')?.value||null})});
  fechar('m-det');
  carregar();
}

async function avaliar(nota){
  if(!ticketAtual)return;
  await api('/itsm/tickets/'+ticketAtual.id+'/satisfacao',{method:'POST',body:JSON.stringify({nota})});
  alert('✅ Obrigado pelo teu feedback!');
  fechar('m-det');
}

// ── INIT ──
async function init(){
  if(!TOKEN){window.location.href='/';return;}
  renderSB();
  try{
    await api('/itsm/setup',{method:'POST'}).catch(()=>{});
    [cats,users]=await Promise.all([
      api('/itsm/categorias').catch(()=>[]),
      api('/utilizadores').then(r=>r?.utilizadores||r||[]).catch(()=>[]),
    ]);
    const sc=document.getElementById('n-cat');
    if(sc) sc.innerHTML='<option value="">Sem categoria</option>'+cats.map(c=>`<option value="${c.id}">${c.icone} ${c.nome}</option>`).join('');
    const su=document.getElementById('n-atrib');
    if(su) su.innerHTML='<option value="">Não atribuído</option>'+users.map(u=>`<option value="${u.id}">${u.nome_completo}</option>`).join('');
  }catch(e){console.warn(e);}
  carregar();
}

init();
